[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flotsam"
version = "0.2.0"
description = "Service Worker Cache Storage abuse hunting for DFIR (zero-dependency)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["forensics", "dfir", "service-worker", "cache-storage", "browser", "threat-hunting"]

[project.scripts]
flotsam = "flotsam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
